<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MPL — Modern Project Leaders Co. شركة قادة المشاريع الحديثة — حلول الإنشاء والهندسة المتكاملة في المملكة العربية السعودية." />
  <title>MPL — Modern Project Leaders</title>

  <!-- Favicon (orange square placeholder) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23F8A740'/></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Static styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- React root -->
  <div id="root"></div>

  <!-- ── Dependencies (order matters) ─────────────────────────────── -->

  <!-- 1. React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- 2. Lucide React icons (UMD → global LucideReact) -->
  <script src="https://unpkg.com/lucide-react/dist/umd/lucide-react.js"></script>

  <!-- 3. Babel standalone (JSX transpilation in-browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 4. App (must be type="text/babel" so Babel transpiles JSX) -->
  <script type="text/babel" src="script.js"></script>

</body>
</html>
